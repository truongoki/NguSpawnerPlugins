name: Build NguSpawner

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build NguSpawner
        run: mvn clean package -DskipTests

      - name: Upload NguSpawner JAR
        uses: actions/upload-artifact@v4
        with:
          name: NguSpawner
          path: target/*.jar
